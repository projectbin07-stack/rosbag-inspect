name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13", "3.14"]
    env:
      MSYS_NO_PATHCONV: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev,zstd]"
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Type check
        run: mypy
      - name: Test
        run: pytest --cov --cov-report=term-missing --cov-fail-under=85
      - name: CLI smoke test
        shell: bash
        run: |
          python tests/make_fixtures.py fixtures
          rosbag-inspect --version
          rosbag-inspect info fixtures/drive_sqlite
          rosbag-inspect info fixtures/drive.mcap --json > info.json
          rosbag-inspect echo fixtures/drive_lz4.mcap /imu --limit 2
          rosbag-inspect export fixtures/drive_nosummary.mcap /odom odom.csv
          rosbag-inspect export fixtures/drive.mcap /scan scan.csv --arrays
          python -c "import csv; r = next(csv.DictReader(open('scan.csv'))); v = [float(x) for x in r['ranges'].split()]; assert len(v) == int(r['ranges.length']) and v[0] == float('inf'), v[:3]"
          rosbag-inspect echo fixtures/drive.mcap /scan --limit 1 --nonfinite null | python -c "import json, sys; m = json.loads(sys.stdin.read())['message']; assert m['ranges'][0] is None"
          set +e
          rosbag-inspect check fixtures/drive.mcap --report report.html --expect /scan:10
          test $? -eq 2 || exit 1
          rosbag-inspect check fixtures/drive_sqlite --json > report.json
          test $? -eq 2 || exit 1
          set -e
          test -s report.html
          python -c "import json; d = json.load(open('report.json')); assert d['verdict'] == 'fail', d['summary']"
